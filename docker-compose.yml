# Runs the whole system locally:  docker compose up --build
#   Web app     http://localhost:8080
#   API         http://localhost:4000  (health: /health)
#   OpenSearch  http://localhost:9200
# A local account is seeded: demo@linkvault.local / linkvault-demo (or use "Try the demo").
name: linkvault

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Dev cluster: don't block writes when the host disk is nearly full.
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # Security is disabled for local development, so only expose it on this machine.
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_PREFIX: linkvault
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:4173
      SEED_LOCAL_DEMO_ACCOUNT: 'true'
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      opensearch:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8080:8080'
    depends_on:
      - api

volumes:
  opensearch-data:
